spring.config.import=optional:file:./secrets.properties

spring.application.name=InventarioProBackend
server.port=4000
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME:}

spring.datasource.url=jdbc:sqlite:${user.dir}/data/inventario.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET:inventario-pro-dev-secret-change-me-please-1234567890}
app.jwt.expiration-minutes=720

app.cors.allowed-origin=http://localhost:3000
